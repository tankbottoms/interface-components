<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Four-up component grid in black / white / grey. The alternating
       fill keeps the mark legible against both light and dark tab bars. -->
  <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
  <rect x="6" y="6" width="40" height="40" fill="#1a1a1a"/>
  <rect x="54" y="6" width="40" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <rect x="6" y="54" width="40" height="40" fill="#8f8f89"/>
  <rect x="54" y="54" width="40" height="40" fill="#1a1a1a"/>
</svg>
